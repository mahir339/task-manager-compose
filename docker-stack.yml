services:
  backend:
    image: task-manager-compose-backend:latest
    networks:
      - app-net
    deploy:
      replicas: 2

  frontend:
    image: task-manager-compose-frontend:latest
    ports:
      - "8088:80"
    networks:
      - app-net
    deploy:
      replicas: 1

networks:
  app-net:
    driver: overlay
